# dsh-phone 版本单一来源（single source of truth）
#
# 为什么有这个文件：过去 versionCode 999 硬编码在 01-modify-termux.sh 里，
# 于是每次出包的 versionCode 完全相同 —— 系统无法区分新旧包，只能靠人工把
# APK 改名成 DSH-Phone-v999-r95-*.apk 来讲批次。改名不是版本管理：
#   1. 装错批次时系统不会拦（versionCode 相同 = "同版本覆盖安装"）；
#   2. 文件名与真实版本一旦对不上就无从追溯。
#
# 规则（改这里，不要改脚本里的字面量）：
#   - version_code 必须**递增**。Android 用 versionCode 判「降级安装」并直接
#     拒绝安装，所以新包一定要比旧包大。留出余量，别每次只 +1（要给
#     并行分支/回滚留空间）。
#   - version_name 是人类可读版本，展示在应用信息里，随便改。
#   - 改了 dsh/node 版本后，必须同时递增 version_code，
#     并递增 DshBootstrap.BUNDLE_REV（android-java/.../DshBootstrap.java:37），
#     否则旧安装会命中 stamp **跳过重新解包**，新 bundle 永远装不上。

[version]
# 当前 999 是历史值（硬编码遗留）。下一版请用 1000。
# 真机上已装版本为 1134（30.117.0，2026-11-10），必须高于它，
# 否则 adb install 会被系统判为降级安装直接拒绝。
version_code = 1200
version_name = 1.0.0

# 出包批次号，仅用于产物文件名便于人工识别，不参与 Android 版本判定。
# 每次出包 +1。
# r104：顶部状态栏配色与 dsh 首页对齐（DshPalette.systemBar）。
# r105：落地设计系统令牌层（--dsh-*）+ 修对比度公式伽马校正 + 弱化色回调 #5A6D84。
# r106：方案 A（SAF 存储目录）—— 新增 SafConfig/SafTree/SafProxyServer +
#       assets/dsh/saf-fs-shim.js；抽屉加「存储目录」行。见 docs/saf-feasibility.md §7。
# r107：修 saf-fs-shim.js 的 config()↔fs.statSync 无限互递归（真机「自检未通过」的根因：
#       每次 relOf 烧 2200 层栈，dsh 启动被拖死、3080 永不监听）。本地 A/B：改前 75s 未就绪
#       → 改后 6s 就绪。另：MainActivity.onCreate 补一次 SafProxyServer.start（DshService
#       未在 manifest 注册，原「随服务起停」路径是死的 → 会留下 enabled:true 的过期配置）。
# r108：同步回执补 warn 态 —— 有冲突保留时单独分色 + 加粗（mobile.js setSyncResult()，
#       mobile.css .dsh-syc-warn），补齐 V2-b 语义色最后一块。headless Edge 实测三态
#       两套主题对比度全部达标（OK/WARN/ERR 浅色 5.03~12.98:1，深色 6.83~8.60:1）。
# r109（v2.3 批 A）：并入 0.2.x 世代壳层 ——
#       1. dsh 升到 0.2.1-rc.5，官方 Web UI 自带移动端响应式；
#          随之**删除**针对 0.1.x 桌面优先布局的注入层（MobileTuning/DshAssets +
#          assets/dsh/{mobile.css,mobile.js,market.css,market-chrome.css}）。
#       2. 改为注入轻量桥：official-bridge.js（主题/状态/设置入口）+ engine-switcher.js
#          （端点切换页）+ engine-proxy.mjs（远程引擎反代），源码在 DshWebViewClient /
#          webview/OfficialShell。
#       3. 并入运行时抽象（RuntimeProvider / DshRuntimeSelector / DshTermuxRuntime /
#          DshProotRuntime，PRoot 资源缺失时自动回退 Termux）、DshPreloadWeb 预热、
#          DshWakeLock、DshHttp 裸 Socket 客户端、NAS 传输扩到 WebDAV/SFTP/SMB。
#       4. DshService 正式注册进清单（此前未注册 → 前台服务从未真正起来），
#          补 FOREGROUND_SERVICE / FOREGROUND_SERVICE_DATA_SYNC 权限。
#       5. network_security_config 的 base-config 改为放开明文：局域网 NAS（fnOS
#          WebDAV 默认 http:5005）必须能直连，与 v2.3 S-6.7 的 Relay 档同一套理由。
# r110：登录白屏修复 + 收割 bundle 的符号链接放行。
#       1. DshChromeClient 补 onCreateWindow：window.open(授权 URL) 原本会让主 WebView
#          落到 about:blank（真机 1134 登录白屏的根因）；现在用一次性承载 WebView 接住，
#          远程地址交系统浏览器、本地地址交回主 WebView。
#       2. DshBootstrap.safeLinkTarget 由「一刀切拒 ../」改为词法归一后判是否爬出根：
#          run-as 收割的 bundle 里 node_modules/.bin/* 全是 ../ 相对链接
#          （如 .bin/claude -> ../@anthropic-ai/sdk/bin/cli），旧规则会在 7 万文件处
#          整包解包失败。Zip Slip 防线不降级：绝对路径 / UNC / 归一后越根仍拒绝。
# r111（v2.3 并行前置 · 手机壳侧）：三块原生页面开工件 + 省电放行 + 桌面校验。
#       1. 配对页 PairActivity：填电脑地址 + 6 位配对码，两步配对（/pair → /pair/verify），
#          首次配对带上设备公钥指纹（接 wb-cloud-sync r24 的 devicePubKey 钉住）。
#       2. PC 离线页 OfflineActivity：探免鉴权 /health，区分「地址不通 / Relay 在但电脑没上线 /
#          在线 N 台」，把四种处置分清，而不是给一个转圈。
#       3. 设备密钥 DshDeviceKey：AndroidKeyStore 里的 EC P-256，私钥不可导出；
#          指纹口径 = SPKI 的 SHA-256（64 位小写 hex），与 Relay sanitizeDeviceKey 一致。
#          身份 DshDeviceIdentity 把 phoneId 与密钥绑定同一生命周期，「重新开始」两者一起换。
#       4. 省电放行 DshPowerGuard：三层降级（直呼对话框 → 电池优化列表 → 应用详情）。
#       5. scripts/test-java.sh：桌面 JDK 跑纯逻辑回归（53 条断言，指纹与 HMAC 的期望值
#          由 node crypto 现场计算做跨语言对照）+ 整树编译校验（androidx / com.termux.R 用
#          tests/stubs 的编译期桩）。
# r112：令牌落盘（补 r111 的缺口）——配对成功拿到 deviceToken 却没有任何地方保存，
#       配对结果实际无人消费。新增 DshTokenStore：AndroidKeyStore 里的 AES-256-GCM
#       密钥包裹，密文存 SharedPreferences；解不开即清掉并回落「重新配对」；
#       DshDeviceIdentity.rotate() 同时清令牌（新身份 + 旧凭据会被服务端拒绝且无法自愈）。
#       桥的 pairStatus 增 hasToken（只报有无，不交令牌本体：页面里跑着官方 UI 与第三方插件）。

# r113（手机端，不做插件路线）：按需连接 + 主机切换器 + 响应封套修复。
#       1. 按需连接：远端档案默认**不**自动进入（HostProfile.autoEnterRemote 默认 false）。
#          启动停在选择页（OfflineActivity 的 choice 模式），用户点「进入这台电脑」才连；
#          切换器/离线页在用户确认后拉起 MainActivity 时带 EXTRA_ENTER_REMOTE=true 跳过守卫。
#          理由：打开应用多数意味着「用手机上的 dsh」，自动连一台已离线/被收回的电脑
#          只会停在白屏。
#       2. 主机切换器 HostSwitcherActivity（第三块原生页）：GET /api/hosts 列可切电脑，
#          POST /api/hosts/select 带 confirmNoMigration:true；切换后清 cookie + 作废预热
#          （抽出 ProfileSession，两个切档入口共用，防 R-22 跨主机串会话）。
#       3. **修复**：Relay 响应封套是 {ok, data, protocol}、失败是 {ok:false, error:{code}}，
#          而 r111 的客户端按顶层字段解析 → deviceToken/challenge/online 全为 null，
#          对真 Relay 表现为「配对一直失败但错误码为空」「离线页永远 0 台在线」。
#          改为统一取 data 内层（容忍裸对象形态），错误码取 error.code。
#       4. HostsError：切换失败按码给处置（未授权/缺确认/目标不在/名额满/网络）。
#       5. 清单注入改为**逐页幂等**（原守卫「PairActivity 已存在就整块跳过」会漏掉新页）。
build_rev = 113

[components]
# 与 node_modules 里实际安装的版本保持一致；升级 dsh 时一并更新。
# ⚠️ 2026-11-14 真机实测（adb run-as com.dsh.harness → files/usr/bin/node，即 dsh-web.sh
#    使用的 $PREFIX/bin/node）：node 报 v24.18.0，与下面的 22.22.2 不一致。
#    说明要么 bundle 不是用本文件声明的版本打的，要么这里已经过期。
#    下次出包前必须核实并让两者一致 —— 否则 BUNDLE_REV / version_code 的判定依据是错的。
dsh_version = 0.2.2-rc.1
node_version = 22.22.2