# r122（SSH 档联调打通）：补 ssh-keyscan + 试探连接兜底。
#       1. 本机没有 sshd（Windows 只带 OpenSSH 客户端，且 Windows 的 sshd 必须由 SYSTEM
#          起服务），于是写了 tests/ssh-testdouble/：用 ssh2 起一个「接受任意公钥 + 转发
#          direct-tcpip」的服务端，配一个只绑回环的假 3080。真机经 Tailscale 连上来，
#          端到端验通了隧道层（见 docs/native-pages.md §18 的证据）。
#       2. **联调暴露的真实缺口**：bundle 里只有 ssh/ssh-keygen/scp/sftp，没有
#          ssh-keyscan —— fetch-openssh.sh 的白名单漏了它，02b 的 tar 清单也跟着漏。
#          结果首次连接取不到主机公钥，TOFU 无法建立；而界面把原因说成「对端不可达」，
#          排查方向被引到网络，与真实原因（包里缺一个二进制）无关。
#       3. fetch-openssh.sh 与 02b-harvest-bundle.sh 的清单都补上 ssh-keyscan；
