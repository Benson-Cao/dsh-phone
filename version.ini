# r122（SSH 档联调打通）：补 ssh-keyscan + 试探连接兜底。
#       1. 本机没有 sshd（Windows 只带 OpenSSH 客户端，且 Windows 的 sshd 必须由 SYSTEM
#          起服务），于是写了 tests/ssh-testdouble/：用 ssh2 起一个「接受任意公钥 + 转发
#          direct-tcpip」的服务端，配一个只绑回环的假 3080。真机经 Tailscale 连上来，
#          端到端验通了隧道层（见 docs/native-pages.md §18 的证据）。
#       2. **联调暴露的真实缺口**：bundle 里只有 ssh/ssh-keygen/scp/sftp，没有
#          ssh-keyscan —— fetch-openssh.sh 的白名单漏了它，02b 的 tar 清单也跟着漏。
#          结果首次连接取不到主机公钥，TOFU 无法建立；而界面把原因说成「对端不可达」，
#          排查方向被引到网络，与真实原因（包里缺一个二进制）无关。
#       3. fetch-openssh.sh 与 02b-harvest-bundle.sh 的清单都补上 ssh-keyscan；
#          BUNDLE_REV v6-ssh2 → v7-ssh3，老安装会重解包拿到新二进制。
#       4. DshSshTunnel 增 keyscanAvailable()；scanKeyLine 在 keyscan 缺失或扫不到时
#          改走 scanKeyLineViaConnect()：用一次 StrictHostKeyChecking=no 的试探连接让
#          ssh 自己把公钥写进临时 known_hosts（host key 在密钥交换阶段就落盘，早于认证，
#          信任模型与 keyscan 一致），正式连接仍 StrictHostKeyChecking=yes。
#       5. 失败文案分流：缺二进制时明确说「包里的 ssh-keyscan 没有」，而不是笼统地让用户
#          去查网络。
# r123（第四块原生页）：SSH 主机配置页 —— 把「没有调用方」的 setSsh 接上界面。
#       1. 缺口：setSsh 早在 r115 就写好，但全仓库**零调用方**，也没有任何页面能填
#          主机/端口/用户名 → SSH 档对真实用户不可达，比「缺一台 sshd」更前置。
#       2. 新增 SshConfigActivity：四个输入框 + 「测试连接」+「保存并连接」。
#          「测试连接」不是只探端口，而是按真实序列走完：取主机公钥 → 指纹比对 →
