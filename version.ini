# r115（手机端续做）：SSH 档（批 C）代码落地 —— 受 bundle 无 ssh 阻塞，降级为显式提示。
#       1. DshSshTunnel：环境与 dsh-web.sh 对齐（PREFIX/HOME/LD_LIBRARY_PATH/OPENSSL_CONF），
#          起 `ssh -N -T -L 127.0.0.1:<localPort>:127.0.0.1:3080`，BatchMode=yes +
#          ExitOnForwardFailure=yes + StrictHostKeyChecking=yes + ServerAlive 20s×3。
#       2. 主机指纹 TOFU：SshHostKey 纯逻辑（blob→SHA256:base64 无填充；decide 首次/一致/
#          不一致），不同即**阻断**；ssh-keyscan 取原始行写 known_hosts（非 22 端口用
#          [host]:port，否则 ssh 认不出）。取不到指纹时按 MISMATCH 处理，绝不当"首次"放行。
#       3. 密钥认证而非密码：包内无 askpass/sshpass；首次用 ssh-keygen 生成 ed25519 到
#          $HOME/.ssh，公钥由用户加到对端 authorized_keys。
#       4. 就绪判定用「本地端口能 accept」而不是「进程还活着」——后者在密钥被拒时也会活几秒。
#       5. 当前 bundle 的 usr/bin 没有 ssh/ssh-keygen（已 run-as 核实），available() 为 false，
#          界面如实给出重出包指引，不假装连接。
