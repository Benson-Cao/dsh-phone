#       3. 并入运行时抽象（RuntimeProvider / DshRuntimeSelector / DshTermuxRuntime /
#          DshProotRuntime，PRoot 资源缺失时自动回退 Termux）、DshPreloadWeb 预热、
#          DshWakeLock、DshHttp 裸 Socket 客户端、NAS 传输扩到 WebDAV/SFTP/SMB。
#       4. DshService 正式注册进清单（此前未注册 → 前台服务从未真正起来），
#          补 FOREGROUND_SERVICE / FOREGROUND_SERVICE_DATA_SYNC 权限。
#       5. network_security_config 的 base-config 改为放开明文：局域网 NAS（fnOS
#          WebDAV 默认 http:5005）必须能直连，与 v2.3 S-6.7 的 Relay 档同一套理由。
# r110：登录白屏修复 + 收割 bundle 的符号链接放行。
#       1. DshChromeClient 补 onCreateWindow：window.open(授权 URL) 原本会让主 WebView
#          落到 about:blank（真机 1134 登录白屏的根因）；现在用一次性承载 WebView 接住，
#          远程地址交系统浏览器、本地地址交回主 WebView。
#       2. DshBootstrap.safeLinkTarget 由「一刀切拒 ../」改为词法归一后判是否爬出根：
#          run-as 收割的 bundle 里 node_modules/.bin/* 全是 ../ 相对链接
#          （如 .bin/claude -> ../@anthropic-ai/sdk/bin/cli），旧规则会在 7 万文件处
#          整包解包失败。Zip Slip 防线不降级：绝对路径 / UNC / 归一后越根仍拒绝。
# r111（v2.3 并行前置 · 手机壳侧）：三块原生页面开工件 + 省电放行 + 桌面校验。
#       1. 配对页 PairActivity：填电脑地址 + 6 位配对码，两步配对（/pair → /pair/verify），
#          首次配对带上设备公钥指纹（接 wb-cloud-sync r24 的 devicePubKey 钉住）。
#       2. PC 离线页 OfflineActivity：探免鉴权 /health，区分「地址不通 / Relay 在但电脑没上线 /
#          在线 N 台」，把四种处置分清，而不是给一个转圈。
#       3. 设备密钥 DshDeviceKey：AndroidKeyStore 里的 EC P-256，私钥不可导出；
#          指纹口径 = SPKI 的 SHA-256（64 位小写 hex），与 Relay sanitizeDeviceKey 一致。
#          身份 DshDeviceIdentity 把 phoneId 与密钥绑定同一生命周期，「重新开始」两者一起换。
#       4. 省电放行 DshPowerGuard：三层降级（直呼对话框 → 电池优化列表 → 应用详情）。
#       5. scripts/test-java.sh：桌面 JDK 跑纯逻辑回归（53 条断言，指纹与 HMAC 的期望值
#          由 node crypto 现场计算做跨语言对照）+ 整树编译校验（androidx / com.termux.R 用
#          tests/stubs 的编译期桩）。
# r112：令牌落盘（补 r111 的缺口）——配对成功拿到 deviceToken 却没有任何地方保存，
#       配对结果实际无人消费。新增 DshTokenStore：AndroidKeyStore 里的 AES-256-GCM
#       密钥包裹，密文存 SharedPreferences；解不开即清掉并回落「重新配对」；
#       DshDeviceIdentity.rotate() 同时清令牌（新身份 + 旧凭据会被服务端拒绝且无法自愈）。
#       桥的 pairStatus 增 hasToken（只报有无，不交令牌本体：页面里跑着官方 UI 与第三方插件）。

# r113（手机端，不做插件路线）：按需连接 + 主机切换器 + 响应封套修复。
#       1. 按需连接：远端档案默认**不**自动进入（HostProfile.autoEnterRemote 默认 false）。
#          启动停在选择页（OfflineActivity 的 choice 模式），用户点「进入这台电脑」才连；
#          切换器/离线页在用户确认后拉起 MainActivity 时带 EXTRA_ENTER_REMOTE=true 跳过守卫。
#          理由：打开应用多数意味着「用手机上的 dsh」，自动连一台已离线/被收回的电脑
#          只会停在白屏。
#       2. 主机切换器 HostSwitcherActivity（第三块原生页）：GET /api/hosts 列可切电脑，
#          POST /api/hosts/select 带 confirmNoMigration:true；切换后清 cookie + 作废预热
#          （抽出 ProfileSession，两个切档入口共用，防 R-22 跨主机串会话）。
#       3. **修复**：Relay 响应封套是 {ok, data, protocol}、失败是 {ok:false, error:{code}}，
#          而 r111 的客户端按顶层字段解析 → deviceToken/challenge/online 全为 null，
#          对真 Relay 表现为「配对一直失败但错误码为空」「离线页永远 0 台在线」。
#          改为统一取 data 内层（容忍裸对象形态），错误码取 error.code。
#       4. HostsError：切换失败按码给处置（未授权/缺确认/目标不在/名额满/网络）。
#       5. 清单注入改为**逐页幂等**（原守卫「PairActivity 已存在就整块跳过」会漏掉新页）。
# r114（手机端续做）：三块原生页补入口 + 版本一致性可复跑 + 记录 SSH 批 C 的真实阻塞。
#       1. **入口**（关键缺口）：三页此前在默认 local 档下**没有任何入口**——配对页只能从
#          离线页/切换器进，而离线页只在远端档案启动时出现。新增 assets/dsh/connection-entry.js：
#          在窄栏 #dsh-rail-foot 加一个「连接」图标，点击按 pairStatus() 路由——
#          已配对且有令牌 → 切换器；其余 → 配对页。只加图标，不写页面、不改宿主布局。
#       2. scripts/check-node-version.sh：run-as 起真机 bundle 的 node 报版本，与 version.ini
#          比对。node_version 按真源对齐 22.22.2 → 24.18.0（bundle 从设备收割，设备即真源）。
#       3. **SSH 档（批 C）的真实阻塞已核实**：当前安装包 files/usr/bin 里没有
#          ssh/ssh-keygen/scp/sftp（02-build-bundle.sh 支持随包，但这一版没带），
#          隧道在本安装包上跑不起来 → 先不动，等新 bundle。
# r115（手机端续做）：SSH 档（批 C）代码落地 —— 受 bundle 无 ssh 阻塞，降级为显式提示。
#       1. DshSshTunnel：环境与 dsh-web.sh 对齐（PREFIX/HOME/LD_LIBRARY_PATH/OPENSSL_CONF），
#          起 `ssh -N -T -L 127.0.0.1:<localPort>:127.0.0.1:3080`，BatchMode=yes +
#          ExitOnForwardFailure=yes + StrictHostKeyChecking=yes + ServerAlive 20s×3。
#       2. 主机指纹 TOFU：SshHostKey 纯逻辑（blob→SHA256:base64 无填充；decide 首次/一致/
#          不一致），不同即**阻断**；ssh-keyscan 取原始行写 known_hosts（非 22 端口用
#          [host]:port，否则 ssh 认不出）。取不到指纹时按 MISMATCH 处理，绝不当"首次"放行。
#       3. 密钥认证而非密码：包内无 askpass/sshpass；首次用 ssh-keygen 生成 ed25519 到
#          $HOME/.ssh，公钥由用户加到对端 authorized_keys。
#       4. 就绪判定用「本地端口能 accept」而不是「进程还活着」——后者在密钥被拒时也会活几秒。
#       5. 当前 bundle 的 usr/bin 没有 ssh/ssh-keygen（已 run-as 核实），available() 为 false，
#          界面如实给出重出包指引，不假装连接。
# r117（出包链路）：让 bundle 真正带上 openssh。
#       1. 新增 scripts/fetch-openssh.sh：从 Termux 官方仓库取 aarch64 openssh deb，
#          PC 侧用 Python 标准库解包（本机没有 ar/7z/xz），把 ssh/ssh-keygen/scp/sftp
#          经 run-as 落到 App 的 files/usr/bin，最后真跑 `ssh -V` 自证。
#          先校验 libcrypto/libssl/libkrb5/libldns/libedit/libandroid-support/libtermux-auth/libz
#          都在 prefix 里，缺任何一个直接失败（不产出半残环境）。
#       2. **02b-harvest-bundle.sh 的 tar 清单原本不含 ssh**（只有 node/bash/usr/lib/home），
#          即使装了也不会进 bundle。改为「prefix 里有才打」，四个二进制按需加入。
#       3. BUNDLE_REV ssh1 → ssh2：bundle 内容变了，必须让老安装重解包。
#       4. Windows 路径两坑写进脚本注释：MSYS 改写 adb 参数（需 MSYS_NO_PATHCONV=1）、
#          关掉改写后源路径要给 Windows 形式（cygpath -w）。
#       5. 随包 ssh 是 Termux 构建，RUNPATH 指向 com.termux；运行靠 LD_LIBRARY_PATH 覆盖。
# r118（真机验证 + 入口修复）：首次真机端到端验证，并修掉「入口挂不上」。
#       1. 出包并覆盖安装成功（versionCode 1200 > 1134）。签名核对：已装包与本机
#          testkey_untrusted.jks 的 SHA-256 都是 b6da0148… → 可覆盖安装，**没有卸载**，
#          Termux 环境与用户会话全部保留。
#       2. 新 bundle 首启重解包：rev=v6-dsh-0.2.2-rc.3-ssh2，86033 条目；解包后
#          files/usr/bin/{ssh,ssh-keygen,scp,sftp} 时间戳=解包时刻，证明**来自 bundle**
#          而非手工 push；ssh -V => OpenSSH_10.6p2。3080 已监听。
#       3. CDP 实测桥与设备身份：window.dshSaf 存在，四方法齐全；
#          pairStatus() 返回 {paired:false, hasToken:false, powerExempt:false,
#          deviceKey:true, fingerprintPrefix:"57246ef6b98136ee"} —— 设备密钥在真机可用。
#       4. **修复入口**：窄屏（innerWidth=360）下 #dsh-rail-foot 根本不存在，
#          所以「等侧栏出现」的挂载方式点不到。增浮动兜底（右下 44px 圆钮）；
#          CDP 确认 fab:true，点击后 topResumedActivity=com.dsh.harness/.PairActivity，
#          配对页正常渲染并显示指纹。既有 engine-switcher 图标在当前布局同样挂不上
#          （railFoot:false / engBtn:false），属既有缺陷，本轮未修。
build_rev = 118

[components]
# 与 node_modules 里实际安装的版本保持一致；升级 dsh 时一并更新。
# dsh_version / node_version 都按真机实测对齐（2026-11-14：dsh 0.2.2-rc.3 / node 24.18.0）。
# node_version 由 `bash scripts/check-node-version.sh` 复核（run-as 起真机 bundle 里的
# files/usr/bin/node 报版本，再与本文件比对）。2026-11-14 实测 v24.18.0 后按真源对齐：
# bundle 是从设备上的 Termux 收割的（02b-harvest-bundle.sh），设备即真源。
# ⚠️ 换 bundle 后必须重跑该脚本；不一致时它会 FAIL，别改这里的数字去迁就。
dsh_version = 0.2.2-rc.3
node_version = 24.18.0