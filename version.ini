#       2. 新增 SshConfigActivity：四个输入框 + 「测试连接」+「保存并连接」。
#          「测试连接」不是只探端口，而是按真实序列走完：取主机公钥 → 指纹比对 →
#          生成/读取密钥 → 写 known_hosts → 起 ssh -L → 等本地端口 accept → 停掉；
#          哪一步失败就报那一步（对端不可达 / 指纹不一致 / 公钥没被接受，处置完全不同）。
#          页面把本机公钥摊出来且可选中复制 —— 用户要贴到对端 authorized_keys。
#       3. 测试阶段**不钉住**首次见到的主机指纹：钉住是「保存并连接」的动作，
#          否则一次手滑的测试会留下错误钉子，之后只会报指纹不一致。
#       4. SshForm：校验抽成纯函数（主机栏不许带 ssh://、user@、端口、前导 -；端口边界；
#          本机端口 1024–65535 且不得与 SSH 端口相同），桌面 JDK 下了 25 条断言。
#          非法端口给 -1 而不是静默回落默认值 —— 回落会让「22a2」连到 22 上，更危险。
#       5. 入口三处：主机切换器「连 SSH 主机」、配对页「改用 SSH 连一台机器」、
#          离线页「连 SSH 主机」。SSH 不走 Relay 也就不需要配对码，入口不能只挂在配对流程里。
#       6. HostProfile.savedSsh()：回填上一次配置。**不**用「切到 ssh 档再切回来」取快照
#          —— 那会落盘两次，用户只是打开配置页，档案不该被动。
#       7. DshSshTunnel.waitLocalPort 由 MainActivity 私有方法下沉为公有静态：主界面与
#          配置页共用同一份就绪判据，避免一处 400ms 一处忘了 sleep 的漂移。
#       8. 清单注入的外层守卫修掉：原先只看 HostSwitcherActivity 是否存在就整块跳过，
#          于是**新增**的页永远进不去注入块（已存在的页挡住还没注册的页）。
# r124（按实机反馈纠三处认知偏差）：
#       1. **SSH 档的远端端口写死是错的**：`-L …:127.0.0.1:3080` 里那个 3080 是拿手机端引擎
#          端口想当然。实测这台 Windows 上 dsh 监听 61167，3080 上什么都没有 —— 隧道"通"了
#          也只是打到空端口。改为档案里的 targetPort（默认 3080，配置页可填，1–65535 校验）。
#       2. **SSH 档缺令牌**：电脑侧 dsh web 对回环请求也鉴权（`GET http://127.0.0.1:61167/`
#          返回 401）。隧道通了但没令牌，点进去是一张 401。新增 token 字段，加载地址改为
#          `SshForm.sshUrl()`（纯函数：空令牌不拼查询串，非空拼 `?token=` 并 URL 编码）。
#          「测试连接」在端口通之后**再取一次 HTTP 状态码**，把「通了但 401」与「通了且能进」
#          分开报：401/403 → 令牌不对；连不上/超时 → 远端端口填错；其它码 → 那头不是 dsh。
#       3. **切换器的「当前使用中」是误导**：该标记来自 Relay 的 `bound`（`phone.boundHostId
#          === deviceId`，即"这台手机在 Relay 侧指向哪台电脑"），与"此刻是否在用"无关；
#          档案停在本机时它照样会显示。文案改为「这台手机的绑定目标」，并在页首说明
#          「绑定是归属、在线是 20 秒心跳」，避免把归属读成实时状态。
# r125（r124 真机验证时抓到的真缺陷：切档后主界面根本没换档案）：
#       1. **CLEAR_TOP 复用旧主界面**：`保存并连接` / `切换到其它电脑` / `改用本机引擎` 都用
#          `MainActivity + FLAG_ACTIVITY_CLEAR_TOP` 拉起主界面。主界面若已在栈里（用户是
#          「主界面 → 连接 → 配置页」进来的，必然在），CLEAR_TOP 只走 onNewIntent，
#          **onCreate 不执行** —— 而档案是在 onCreate 里读的，于是它继续用切档前的快照。
#          真机症状：填了正确令牌保存，隧道 host 对但请求里**没有 ?token**，WebView 拿到 401，
#          界面显示「连不上这台电脑」。三处入口同一缺陷。
#          修法：ProfileSession.restartInto()——`finishAffinity()` + `NEW_TASK|CLEAR_TASK`，
#          旧实例与返回栈一起消失，新实例 onCreate 重读档案（与「重开应用」同语义）。
#       2. **失败页对 SSH 档说的是「（未记录地址）」**：该页统一取 `prof.origin`，而 ssh 档的
#          origin 恒为空串 —— 明明填过地址却等于什么都没说。改为按档案类型呈现：
#          `user@host:端口 → 127.0.0.1:本机端口（电脑侧端口 N）`；relay 档仍显示 origin，
#          未记录时给「这台电脑的地址还没记录」。原因列表也按档案分：SSH 档说 sshd /
#          authorized_keys / 端口填错，不再提「Relay 没在运行」。
# r126（r125 装到真机后验出来的第二层：令牌在 loadUrl 覆盖处被冲掉）：
#       1. r125 修好「主界面复用旧档案」之后，真机请求里**仍然**没有 `?token` —— 因为
#          `showWebView(url)` 对所有远端档统一执行 `url = prof.loadUrl()`（r113 的防串档措施，
#          必须保留），而 ssh 档的 `loadUrl()` 当时返回的是裸 `http://127.0.0.1:<port>/`。
#          于是在调用点拼的令牌被这行覆盖掉：配置里填对了令牌，请求里却没有。
#       2. 修法不在调用点，而在源头：`Profile.loadUrl()` 的 ssh 分支改用
#          `SshForm.sshUrl(localPort, sshToken)`。这样覆盖逻辑、重试逻辑
#          （`DshWebViewClient.dshBaseUrl` 也走 `loadUrl()`）、首载三处自动一致。
#          `baseOrigin()` 保持不带查询串 —— 同源判定不能被令牌污染。
# r127（真机换到真实 dsh web 后验出来的两层问题）：
#       1. 「测试连接」把真 dsh 的 303 误报成「不像是 dsh 的界面」：探针关掉自动跟随，
#          而 dsh 接受令牌后回的是 303 + Location: ./ + 签名 cookie，跟随跳转才 200。
#          判定抽成纯函数 SshForm.probeVerdict（200 或 303+./ → 可进入；401/403 → 令牌不对；
#          0/-1 → 无应答；其它 → 形态不对），桌面断言 116 → 125、整树 185 类编译通过。
#       2. 配置页说明文案三处与实测不符：SSH 档不启动本机引擎（原「照常在本地」相反）、
#          公钥登记路径补 pc-sshd 的 .dsh/ssh/authorized_keys、端口口径去掉歧义。
#       3. bundle 内容没变（只改 Java 源码），BUNDLE_REV 保持 v7-dsh-0.2.2-rc.3-ssh3 不动。
# r128（装机后点「进入这台电脑」把 SSH 档改成了 Relay 档）：
#       1. OfflineActivity.enterRemote() 早年版无条件 setRelay + setCurrent(relay)，
#          current=ssh 的用户点一次就被换成没在运行的 Relay（127.0.0.1:8899），
#          失败页还显示 Relay 地址与 Relay 原因，排查方向整个被带偏。
#          新增纯函数 RemoteEntryRules.keepCurrentProfile(kind)：SSH 档原样保留、
#          只跳过按需连接守卫；Relay 档仍走三要素补齐。
#       2. enterRemote / useLocal 两个出口改用 ProfileSession.restartInto()，
#          避免 CLEAR_TOP 命中已有 MainActivity 时 onCreate 不执行（r125 同类缺陷）。
#       3. 断言 125 → 130，整树 186 类编译通过。bundle 未变，BUNDLE_REV 不动。
build_rev = 128

[components]
# 与 node_modules 里实际安装的版本保持一致；升级 dsh 时一并更新。
# dsh_version / node_version 都按真机实测对齐（2026-11-14：dsh 0.2.2-rc.3 / node 24.18.0）。
# node_version 由 `bash scripts/check-node-version.sh` 复核（run-as 起真机 bundle 里的
# files/usr/bin/node 报版本，再与本文件比对）。2026-11-14 实测 v24.18.0 后按真源对齐：
# bundle 是从设备上的 Termux 收割的（02b-harvest-bundle.sh），设备即真源。
# ⚠️ 换 bundle 后必须重跑该脚本；不一致时它会 FAIL，别改这里的数字去迁就。
dsh_version = 0.2.2-rc.3
node_version = 24.18.0